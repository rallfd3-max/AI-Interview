<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0, user-scalable=0">
    
    <link rel="stylesheet" href="../../css/theme/style/theme/index.css">
    <link rel="stylesheet" type="text/css" href="../../css/app.css" />
    <link rel="stylesheet" type="text/css" href="../../css/style.css" />
    
    <title>修改密码</title>
</head>
<body>
    <div id="changePasswordApp">
        <div class="change-password-container">
            <el-card class="password-card">
                <div slot="header">
                    <span>修改密码</span>
                </div>
                <el-form :model="passwordForm" :rules="rules" ref="passwordForm" label-width="100px">
                    <el-form-item label="原密码" prop="oldPassword">
                        <el-input type="password" v-model="passwordForm.oldPassword" placeholder="请输入原密码"></el-input>
                    </el-form-item>
                    <el-form-item label="新密码" prop="newPassword">
                        <el-input type="password" v-model="passwordForm.newPassword" placeholder="请输入新密码"></el-input>
                    </el-form-item>
                    <el-form-item label="确认密码" prop="confirmPassword">
                        <el-input type="password" v-model="passwordForm.confirmPassword" placeholder="请再次输入新密码"></el-input>
                    </el-form-item>
                    <el-form-item>
                        <el-button type="primary" @click="submitForm('passwordForm')">提交</el-button>
                        <el-button @click="goBack">返回</el-button>
                    </el-form-item>
                </el-form>
            </el-card>
        </div>
    </div>

    <script src="../../libs/vue.js"></script>
    <script src="../../libs/axios.min.js"></script>
    <script src="../../libs/element-ui/index.js"></script>
    <script>
        new Vue({
            el: '#changePasswordApp',
            data() {
                const validateConfirmPassword = (rule, value, callback) => {
                    if (value === '') {
                        callback(new Error('请再次输入密码'));
                    } else if (value !== this.passwordForm.newPassword) {
                        callback(new Error('两次输入密码不一致!'));
                    } else {
                        callback();
                    }
                };
                return {
                    passwordForm: {
                        oldPassword: '',
                        newPassword: '',
                        confirmPassword: ''
                    },
                    rules: {
                        oldPassword: [
                            { required: true, message: '请输入原密码', trigger: 'blur' }
                        ],
                        newPassword: [
                            { required: true, message: '请输入新密码', trigger: 'blur' },
                            { min: 6, message: '密码长度不能小于6位', trigger: 'blur' }
                        ],
                        confirmPassword: [
                            { validator: validateConfirmPassword, trigger: 'blur' }
                        ]
                    }
                }
            },
            methods: {
                submitForm(formName) {
                    this.$refs[formName].validate((valid) => {
                        if (valid) {
                            // 从 localStorage 获取用户信息
                            let userInfo = JSON.parse(localStorage.getItem("user"));
                            
                            if (!userInfo || !userInfo.id) {
                                this.$message.error('未获取到用户信息，请重新登录');
                                setTimeout(() => {
                                    window.location.href = '../../login.html';
                                }, 1500);
                                return;
                            }
                            
                            axios.post(`http://${window.location.hostname}:8080/user/updatePassword`, {
                                id: userInfo.id,
                                oldPassword: this.passwordForm.oldPassword,
                                password: this.passwordForm.newPassword
                            }, {
                                headers: {
                                    'Content-Type': 'application/json'
                                }
                            })
                            .then(res => {
                                if (res.data.status == 200) {
                                    this.$message.success('密码修改成功！');
                                    setTimeout(() => {
                                        window.location.href = 'admin.html';
                                    }, 1500);
                                } else {
                                    this.$message.error(res.data.msg || '修改密码失败');
                                }
                            })
                            .catch(err => {
                                console.error(err);
                                this.$message.error('修改密码失败，请稍后重试');
                            });
                        }
                    });
                },
                goBack() {
                    window.location.href = 'admin.html';
                }
            }
        });
    </script>
    <style>
        .change-password-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f5f7fa;
        }
        .password-card {
            width: 500px;
        }
    </style>
</body>
</html>

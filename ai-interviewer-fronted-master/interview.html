<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI面试官复试系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #2c3e50);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 30px;
        }
        
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .interview-info {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }
        
        .info-item {
            background: rgba(0, 0, 0, 0.2);
            padding: 12px 15px;
            border-radius: 10px;
        }
        
        .info-item h3 {
            font-size: 1rem;
            color: #a6f0ff;
            margin-bottom: 5px;
        }
        
        .info-item p {
            font-size: 1.1rem;
            font-weight: 500;
        }
        
        .chat-container {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            height: 65vh;
        }
        
        .chat-header {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .chat-header h2 {
            font-size: 1.4rem;
            color: #64ffda;
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff4757;
        }
        
        .status-dot.active {
            background: #2ed573;
            box-shadow: 0 0 10px #2ed573;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .message {
            display: flex;
            max-width: 85%;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
            margin: 0 10px;
        }
        
        .user .avatar {
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            color: #000;
        }
        
        .bot .avatar {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: #000;
        }
        
        .text {
            padding: 15px;
            border-radius: 18px;
            line-height: 1.5;
            position: relative;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .user .text {
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            border-bottom-right-radius: 5px;
        }
        
        .bot .text {
            background: rgba(255, 255, 255, 0.1);
            border-bottom-left-radius: 5px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        
        .chat-input {
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            gap: 15px;
        }
        
        .chat-input input {
            flex: 1;
            padding: 15px 20px;
            border-radius: 50px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }
        
        .chat-input input:focus {
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 0 2px #4facfe;
        }
        
        .chat-input button {
            padding: 15px 30px;
            border-radius: 50px;
            border: none;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .chat-input button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        .chat-input button:active {
            transform: translateY(0);
        }
        
        .typing-indicator {
            display: inline-flex;
            align-items: center;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            margin-top: 10px;
        }
        
        .typing-dot {
            width: 8px;
            height: 8px;
            background: #4facfe;
            border-radius: 50%;
            margin: 0 2px;
            animation: typing 1.4s infinite ease-in-out;
        }
        
        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-5px); }
        }
        
        .session-info {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
        }
        
        @media (max-width: 768px) {
            .chat-container {
                height: 70vh;
            }
            
            .message {
                max-width: 95%;
            }
            
            .chat-input {
                flex-direction: column;
            }
            
            .chat-input button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>AI面试官复试系统</h1>
            <p>上海第二工业大学 - 智能面试平台</p>
        </header>
        
        <div class="interview-info">
            <div class="info-grid">
                <div class="info-item">
                    <h3>面试者姓名</h3>
                    <p id="candidate-name">加载中...</p>
                </div>
                <div class="info-item">
                    <h3>应聘岗位</h3>
                    <p id="job-title">加载中...</p>
                </div>
                <div class="info-item">
                    <h3>面试轮次</h3>
                    <p>复试</p>
                </div>
                <div class="info-item">
                    <h3>面试状态</h3>
                    <p id="interview-status">等待开始</p>
                </div>
            </div>
        </div>
        
        <div class="chat-container">
            <div class="chat-header">
                <h2>AI面试对话</h2>
                <div class="status-indicator">
                    <div class="status-dot" id="status-dot"></div>
                    <span id="status-text">离线</span>
                </div>
            </div>
            
            <div class="chat-messages" id="chat-messages">
                <!-- 初始系统消息 -->
                <div class="message bot">
                    <div class="avatar">AI</div>
                    <div class="text">
                        您好！我是上海第二工业大学的AI面试官，负责今天的复试环节。<br>
                        请确保您处于安静的环境，准备好后点击下方输入框开始面试。
                    </div>
                </div>
            </div>
            
            <div class="chat-input">
                <input type="text" id="user-input" placeholder="请输入您的回答..." autocomplete="off">
                <button id="btn-send">发送</button>
            </div>
        </div>
        
        <div class="session-info">
            会话ID: <span id="session-id">未建立</span> | 消息Token计数: <span id="token-count">0</span>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 后端地址 - 确保与您的FastAPI服务地址匹配
            const API_BASE_URL = `http://${window.location.hostname}:8000`;
            
            // 获取DOM元素
            const chatMessages = document.getElementById('chat-messages');
            const userInput = document.getElementById('user-input');
            const btnSend = document.getElementById('btn-send');
            const statusDot = document.getElementById('status-dot');
            const statusText = document.getElementById('status-text');
            const candidateName = document.getElementById('candidate-name');
            const jobTitle = document.getElementById('job-title');
            const interviewStatus = document.getElementById('interview-status');
            const sessionIdDisplay = document.getElementById('session-id');
            const tokenCount = document.getElementById('token-count');
            
            // 面试信息
            const interviewInfo = {
                candidateName: "吴**",
                jobTitle: "Java工程师",
                mobile: "13671790755" // 用户手机号作为session ID
            };
            
            // 更新面试信息
            candidateName.textContent = interviewInfo.candidateName;
            jobTitle.textContent = interviewInfo.jobTitle;
            sessionIdDisplay.textContent = interviewInfo.mobile;
            
            // 状态管理
            let isConnected = false;
            let currentBotMessage = null;
            let tokenCounter = 0;
            let eventSource = null;
            let isWaitingResponse = false; // 新增：等待响应标志
            let question = "您好！我是上海第二工业大学的AI面试官，负责今天的复试环节。请确保您处于安静的环境，准备好后点击下方输入框开始面试。";
            
            // 更新连接状态
            function updateStatus(connected) {
                isConnected = connected;
                statusDot.className = connected ? 'status-dot active' : 'status-dot';
                statusText.textContent = connected ? '在线' : '离线';
                interviewStatus.textContent = connected ? '面试进行中' : '面试未开始';
            }
            
            // 添加新消息到聊天窗口
            function addMessage(content, isUser = false) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;
                
                const avatar = document.createElement('div');
                avatar.className = 'avatar';
                avatar.textContent = isUser ? '我' : 'AI';
                
                const textDiv = document.createElement('div');
                textDiv.className = 'text';
                
                if (isUser) {
                    textDiv.textContent = content;
                } else {
                    // 添加打字动画
                    const typingDiv = document.createElement('div');
                    typingDiv.className = 'typing-indicator';
                    typingDiv.innerHTML = `
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    `;
                    textDiv.appendChild(typingDiv);
                    
                    // 保存当前机器人消息的引用
                    currentBotMessage = { element: textDiv, content: '', typing: typingDiv };
                }
                
                messageDiv.appendChild(avatar);
                messageDiv.appendChild(textDiv);
                chatMessages.appendChild(messageDiv);
                
                // 滚动到底部
                chatMessages.scrollTop = chatMessages.scrollHeight;
                
                return textDiv;
            }
            
            // 更新机器人消息
            function updateBotMessage(content) {
                if (!currentBotMessage) return;
                
                // 移除打字动画
                if (currentBotMessage.typing && currentBotMessage.typing.parentNode) {
                    currentBotMessage.typing.parentNode.removeChild(currentBotMessage.typing);
                    currentBotMessage.typing = null;
                }
                
                // 更新内容
                currentBotMessage.content += content;
                currentBotMessage.element.textContent = currentBotMessage.content;
                
                // 更新token计数
                tokenCounter += content.length;
                tokenCount.textContent = tokenCounter;
                
                // 滚动到底部
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
            
            // 完成机器人消息
            function finishBotMessage() {
                currentBotMessage = null;
                isWaitingResponse = false; // 响应完成
                btnSend.disabled = false;  // 启用发送按钮
            }
            
            // 发送消息
            function sendMessage() {
                if (isWaitingResponse) {
                    console.log("请等待上一次响应完成");
                    return;
                }
                
                const message = userInput.value.trim();
                if (!message) return;
                
                // 添加到聊天窗口
                addMessage(message, true);
                
                // 禁用发送按钮防止重复发送
                btnSend.disabled = true;
                isWaitingResponse = true;
                
                // 建立连接或发送消息
                if (!isConnected) {
                    connectSSE(message);
                } else {
                    sendSSEMessage(message);
                }
                
                // 清空输入框
                userInput.value = '';
            }
            
            // 建立SSE连接
            function connectSSE(firstMessage) {
                updateStatus(true);
                
                // 关闭现有连接（如果有）
                if (eventSource) {
                    eventSource.close();
                }
                
                // 构建URL
                const url = new URL(`${API_BASE_URL}/chat`);
                url.searchParams.append('query', firstMessage);
                url.searchParams.append('context', interviewInfo.mobile);
                url.searchParams.append('question', question);
                question = "";
                eventSource = new EventSource(url);
                
                eventSource.onopen = () => {
                    console.log('SSE连接已建立');
                };
                
                eventSource.onmessage = (event) => {
                    console.log('SSE消息:', event.data);
                    question += JSON.parse(event.data);
                    // 处理常规消息
                    try {
                        // 添加初始机器人消息
                        if (!currentBotMessage) {
                            addMessage('', false);
                        }
                        
                        updateBotMessage(JSON.parse(event.data) );
                        return;
                    } catch (e) {
                        console.error('解析消息错误:', e);
                        return;
                    }
                };

                eventSource.onerror = (error) => {
                    // console.error('SSE错误:', error);
                    if (eventSource) {
                        eventSource.close();
                    }
                    updateStatus(false);
                    // addMessage('抱歉，连接出现问题。请尝试重新发送您的回答。', false);
                    finishBotMessage();
                };
            }
            
            // 发送后续消息
            function sendSSEMessage(message) {
                // 添加新的机器人消息
                addMessage('', false);
                
                // 构建URL
                // 调用python的chat方法
                const url = new URL(`${API_BASE_URL}/chat`);
                url.searchParams.append('query', message);
                url.searchParams.append('context', interviewInfo.mobile);
                url.searchParams.append('question', question);
                let currentAnswer = "";
                fetch(url)
                    .then(response => {
                        if (!response.body) {
                            throw new Error('响应体不可读');
                        }
                        
                        const reader = response.body.getReader();
                        const decoder = new TextDecoder();
                        
                        function read() {
                            reader.read().then(({ value, done }) => {
                                if (done) {
                                    question = currentAnswer;
                                    finishBotMessage();
                                    return;
                                }
                                const text = decoder.decode(value);
                                currentAnswer += text;
                                updateBotMessage(text);
                                read();
                            });
                        }
                        
                        read();
                    })
                    .catch(error => {
                        console.error('请求错误:', error);
                        updateBotMessage('抱歉，处理您的请求时出现问题。');
                        finishBotMessage();
                    });
            }
            
            // 事件监听
            btnSend.addEventListener('click', sendMessage);
            
            userInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    sendMessage();
                }
            });
            
            // 初始化
            updateStatus(false);
        });
    </script>
</body>
</html>
